name: Build geoip.dat

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: geoip-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout runetfreedom/geoip builder
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/geoip
          path: geoip

      - name: Checkout runetfreedom/geodat2srs converter
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/geodat2srs
          path: geodat2srs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./geoip/go.mod
          cache-dependency-path: |
            geoip/go.sum
            geodat2srs/go.sum

      - name: Build geoip builder
        run: go build -C geoip ./

      - name: Build geodat2srs converter
        run: go build -C geodat2srs ./

      - name: Generate geoip files
        run: ./geoip/geoip convert -c ./config.json

      - name: Generate sing-box rule sets
        run: ./geodat2srs/geodat2srs geoip -i ./output/geoip.dat -o ./output/sing-box/rule-set-geoip --prefix geoip-

      - name: Generate sha256 checksum
        run: |
          set -euo pipefail
          cd output
          sha256sum geoip.dat > geoip.dat.sha256
          find sing-box/rule-set-geoip -maxdepth 1 -name '*.srs' -type f -print0 | while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
          (cd sing-box/rule-set-geoip && zip -r ../../sing-box-rule-set-geoip.zip . >/dev/null)
          sha256sum sing-box-rule-set-geoip.zip > sing-box-rule-set-geoip.zip.sha256

      - name: Verify generated files
        run: |
          set -euo pipefail
          test -s output/geoip.dat
          test -s output/geoip.dat.sha256
          (cd output && sha256sum -c geoip.dat.sha256)
          expected_lists="$(jq -r '[.output[] | select(.type == "v2rayGeoIPDat") | .args.wantedList[]] | unique[]' config.json)"
          for list in $expected_lists; do
            test -s "output/sing-box/rule-set-geoip/geoip-${list}.srs"
            (cd output/sing-box/rule-set-geoip && sha256sum -c "geoip-${list}.srs.sha256")
          done
          test -s output/sing-box-rule-set-geoip.zip
          (cd output && sha256sum -c sing-box-rule-set-geoip.zip.sha256)

      - name: Set release date
        run: echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          path: release-branch

      - name: Publish files to release branch
        run: |
          find release-branch -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp output/geoip.dat release-branch/geoip.dat
          cp output/geoip.dat.sha256 release-branch/geoip.dat.sha256
          mkdir -p release-branch/sing-box
          cp -R output/sing-box/. release-branch/sing-box/
          cp output/sing-box-rule-set-geoip.zip release-branch/sing-box-rule-set-geoip.zip
          cp output/sing-box-rule-set-geoip.zip.sha256 release-branch/sing-box-rule-set-geoip.zip.sha256

          cd release-branch
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: publish latest geoip.dat"
            git push
          fi

      - name: Create release tag
        run: |
          git tag -f "${RELEASE_TAG}"
          git push -f origin "refs/tags/${RELEASE_TAG}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GeoIP build ${{ env.BUILD_DATE }}
          body: |
            Automated latest build of geoip.dat and sing-box rule sets

            GeoIP:
            https://github.com/yularzhi/geoip_russia/releases/latest/download/geoip.dat

            Sing-box:
            https://github.com/yularzhi/geoip_russia/releases/latest/download/geoip-ru-blocked.srs

            Sing-box archive:
            https://github.com/yularzhi/geoip_russia/releases/latest/download/sing-box-rule-set-geoip.zip
          files: |
            output/geoip.dat
            output/geoip.dat.sha256
            output/sing-box/rule-set-geoip/*.srs
            output/sing-box/rule-set-geoip/*.srs.sha256
            output/sing-box-rule-set-geoip.zip
            output/sing-box-rule-set-geoip.zip.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoip-and-sing-box
          path: |
            output/geoip.dat
            output/geoip.dat.sha256
            output/sing-box/rule-set-geoip/*.srs
            output/sing-box/rule-set-geoip/*.srs.sha256
            output/sing-box-rule-set-geoip.zip
            output/sing-box-rule-set-geoip.zip.sha256
